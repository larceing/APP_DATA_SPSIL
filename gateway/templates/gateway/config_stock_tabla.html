{% extends "base.html" %}
{% load uistrings %}

{% block title %}{% ui "gateway.config.stock_tabla_title" %}{% endblock %}

{% block content %}
<div class="card">
    <h1>{% ui "gateway.config.stock_tabla_title" %}</h1>
    <p class="text-muted">{% ui "gateway.config.stock_tabla_help" %}</p>

    <form method="post" action="{% url 'gateway:config_save_stock_tabla' %}" style="margin-top: var(--spacing-md);">
        {% csrf_token %}
        <label style="display:flex; align-items:center; gap: var(--spacing-sm);">
            <input type="checkbox" name="activo"{% if config.activo %} checked{% endif %}>
            {% ui "gateway.config.stock_tabla_activo" %}
        </label>
        <button type="submit" class="button" style="margin-top: var(--spacing-md);">{% ui "gateway.config.save_button" %}</button>
    </form>
</div>
{% endblock %}
